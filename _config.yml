# Basic site settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : &name "Junteng Liu"
description              : &description "Natural Language Processing and Machine Learning"
url                      : "https://peltphimarina.github.io"
baseurl                  : "/LJT-Homepage"
repository               : "Peltphimarina/LJT-Homepage"

# Site author
author:
  avatar           :
  name             : "Junteng Liu"
  pronouns         :
  bio              : "Ph.D. candidate at HKUST NLP Group"
  location         :
  employer         :
  uri              :
  email            : "jliugi@connect.ust.hk"
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github           : "Vicent0205"
  twitter          : "junteng88716710"

# Site settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
atom_feed:
  hide                   : true
  path                   :

# SEO and social profiles
twitter:
  username               : "junteng88716710"
social:
  type                   : Person
  name                   : "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
analytics:
  provider               : "false"

# Only the homepage and the existing publications page are published.
include:
  - _pages/about.md
  - _pages/publications.html
exclude:
  - ".devcontainer"
  - ".github"
  - ".gitignore"
  - "AGENTS.md"
  - "Dockerfile"
  - "LICENSE"
  - "README.md"
  - "_drafts"
  - "_portfolio"
  - "_posts"
  - "_publications"
  - "_talks"
  - "_teaching"
  - "docker-compose.yaml"
  - "files"
  - "markdown_generator"
  - "node_modules"
  - "package.json"
  - "scripts"
  - "talkmap"
  - "talkmap.ipynb"
  - "talkmap.py"
  - "talkmap_out.ipynb"
  - "tmp"
  - "vendor"
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# The publication list is written directly on the homepage and publications page.
collections: {}
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Styling and output
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC
plugins: []
whitelist: []

compress_html:
  clippings: all
  ignore:
    envs: development
