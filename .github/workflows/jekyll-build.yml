name: Jekyll build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Verify generated pages
        shell: bash
        run: |
          mapfile -t pages < <(find _site -type f \( -name '*.html' -o -name '*.xml' \) -printf '%P\n' | sort)
          printf 'Generated pages:\n%s\n' "${pages[*]}"
          test "${#pages[@]}" -eq 2
          test "${pages[0]}" = "index.html"
          test "${pages[1]}" = "publications/index.html"
